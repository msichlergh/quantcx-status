# QuantCX uptime monitor. Runs on GitHub Actions every 5 minutes, outside the app's own infrastructure
# (Vercel + Supabase), so it keeps reporting when the app is down. Docs: https://upptime.js.org
owner: msichlergh
repo: quantcx-status

sites:
  - name: App sign-in
    url: https://app.quantcx.com/auth/signin
  - name: Chat widget
    url: https://app.quantcx.com/widget/78002f24-986e-4791-9888-56b4c4d17ed1
  - name: Widget loader (embed.js)
    url: https://app.quantcx.com/embed.js
  - name: Widget launcher API
    url: https://app.quantcx.com/api/widget/78002f24-986e-4791-9888-56b4c4d17ed1/launcher
  - name: Help center
    url: https://help.quantcx.com
  - name: Website
    url: https://quantcx.com
  # Add once /api/health is green (all production env vars set); until then it reports 503 by design:
  # - name: API health
  #   url: https://app.quantcx.com/api/health

# Alerts: add repository secrets (Settings -> Secrets and variables -> Actions), e.g.
#   NOTIFICATION_SLACK=true, NOTIFICATION_SLACK_WEBHOOK=true, NOTIFICATION_SLACK_WEBHOOK_URL=<incoming webhook>
#   or NOTIFICATION_EMAIL=true with the NOTIFICATION_EMAIL_SMTP_* / SENDGRID secrets (see upptime.js.org/docs/notifications)

status-website:
  # Served from GitHub Pages. Switch to `cname: status.quantcx.com` once the DNS record exists.
  baseUrl: /quantcx-status
  logoUrl: https://app.quantcx.com/sites/www-chatbase-co-c9a9c2da/shared/brand/quantcx-favicon.svg
  name: QuantCX Status
  introTitle: "QuantCX service status"
  introMessage: Live availability of the QuantCX app, chat widget and help centers, checked every 5 minutes from outside our infrastructure.
  navbar:
    - title: Status
      href: /
    - title: QuantCX
      href: https://quantcx.com

i18n:
  activeIncidents: Active incidents
  allSystemsOperational: All systems are operational

# Keep this line for Upptime updates.
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"
